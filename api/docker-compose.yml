services:
  postgres:
    image: postgres:16-alpine
    container_name: foilio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: foilio
      POSTGRES_PASSWORD: foilio
      POSTGRES_DB: foilio
    ports:
      - "5432:5432"
    volumes:
      - foilio_postgres_data:/var/lib/postgresql/data

volumes:
  foilio_postgres_data:
