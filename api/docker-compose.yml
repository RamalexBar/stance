services:
  postgres:
    image: postgres:16-alpine
    container_name: stance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stance
      POSTGRES_PASSWORD: stance
      POSTGRES_DB: stance
    ports:
      - "5433:5432"
    volumes:
      - stance_postgres_data:/var/lib/postgresql/data

volumes:
  stance_postgres_data:
