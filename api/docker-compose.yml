services:
  postgres:
    image: postgres:16-alpine
    container_name: rideiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rideiq
      POSTGRES_PASSWORD: rideiq
      POSTGRES_DB: rideiq
    ports:
      - "5432:5432"
    volumes:
      - rideiq_postgres_data:/var/lib/postgresql/data

volumes:
  rideiq_postgres_data:
